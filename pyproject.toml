[project]
name = "agent-starter-kit"
version = "1.0.0"
description = "A reusable starter kit for building, testing, and guarding AI agents on the Anthropic API."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"data/**" = ["E501"]
"tests/**" = ["E501"]
